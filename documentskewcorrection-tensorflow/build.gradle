plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.alexmofer.documentskewcorrection.tensorflow'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }

        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.10.0'
    compileOnly 'org.tensorflow:tensorflow-lite:2.17.0'
    api project(path: ':documentskewcorrection-opencv')
//    api 'io.github.alexmofer.documentskewcorrection:documentskewcorrection-opencv:4.12.0'
}

//apply from: "maven-central-aar.gradle"
apply from: "maven-local-aar.gradle"