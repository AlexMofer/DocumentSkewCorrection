plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.alexmofer.documentskewcorrection.tensorflow'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }

        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    implementation project(path: ':documentskewcorrection-core')
    implementation project(path: ':documentskewcorrection-opencv')
//    compileOnly 'io.github.alexmofer.documentskewcorrection:documentskewcorrection-core:4.11.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    compileOnly 'org.tensorflow:tensorflow-lite:2.17.0'
}

