plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.alexmofer.documentskewcorrection.app'
    compileSdkVersion 36

    defaultConfig {
        applicationId namespace
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.12.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.6'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.guava:guava:33.5.0-android'
    implementation 'io.github.alexmofer.android:support:2.1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    // OpenCV
    implementation project(path: ':documentskewcorrection-opencv')
    // TensorFlow
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation project(path: ':documentskewcorrection-tensorflow')
    // HMS
    implementation 'com.huawei.hms:ml-computer-vision-documentskew:3.11.0.301'
    implementation 'com.huawei.hms:ml-computer-vision-documentskew-model:3.7.0.301'
    implementation project(path: ':documentskewcorrection-hms')
    // UI
    implementation project(path: ':documentskewcorrection-ui')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}