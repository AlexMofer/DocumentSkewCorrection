plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.alexmofer.documentskewcorrection.hms'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }

        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    api project(path: ':documentskewcorrection-core')
//    api 'io.github.alexmofer.documentskewcorrection:documentskewcorrection-core:5.1.0'
    compileOnly 'com.huawei.hms:ml-computer-vision-documentskew:3.11.0.301'
    compileOnly 'com.huawei.hms:ml-computer-vision-documentskew-model:3.7.0.301'
}

