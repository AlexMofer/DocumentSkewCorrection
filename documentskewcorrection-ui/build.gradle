plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.alexmofer.documentskewcorrection.ui'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }

        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    api project(path: ':documentskewcorrection-core')
//    api 'io.github.alexmofer.documentskewcorrection:documentskewcorrection-core:5.0.0'
}

